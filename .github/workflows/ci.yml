name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
          cache: pip
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ner]"
      - name: Run adversarial user simulations
        run: pytest -v tests/test_adversarial_users.py
      - name: Run full test suite with coverage
        run: pytest -v --cov=sovereigngate --cov-report=term-missing
      - name: Lint
        run: ruff check src tests
      - name: Type-check
        run: mypy src
      - name: Audit dependencies
        run: pip-audit
