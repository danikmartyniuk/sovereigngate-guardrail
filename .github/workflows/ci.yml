name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
          cache: pip
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test,typecheck,security,benchmark,litellm,ner]"
      - name: Run adversarial user simulations
        run: pytest -v tests/test_adversarial_users.py
      - name: Run full test suite with coverage
        run: pytest -v --cov=sovereigngate --cov-report=term-missing
      - name: Lint
        run: ruff check src tests
      - name: Type-check
        run: mypy src
      - name: Audit dependencies
        run: pip-audit
