[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[project]
name = "sovereigngate-guardrail"
dynamic = ["version"]
description = "Configurable data-minimization and technical safeguard controls (supporting GDPR Art. 5(1)(c) & Art. 32) for LiteLLM."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-stdnum>=1.20",
    "cryptography>=42.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
litellm = ["litellm>=1.50"]
sidecar = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
ner = ["onnxruntime>=1.19", "tokenizers>=0.20"]
all = ["sovereigngate-guardrail[litellm,sidecar,ner]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5.1",
]
test = ["onnx>=1.16.0", "pytest-cov>=5.0.0"]
typecheck = ["types-PyYAML>=6.0.0"]
security = ["pip-audit>=2.7.0"]
benchmark = ["presidio-analyzer==2.2.366"]

[project.scripts]
sovereigngate = "sovereigngate.cli:app"

[project.urls]
Homepage = "https://github.com/danikmartyniuk/sovereigngate-guardrail"
Repository = "https://github.com/danikmartyniuk/sovereigngate-guardrail"
Issues = "https://github.com/danikmartyniuk/sovereigngate-guardrail/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"
fallback_version = "0.0.0"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/sovereigngate/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sovereigngate"]
artifacts = [
    "src/sovereigngate/_version.py",
    "src/sovereigngate/**/*.json",
    "src/sovereigngate/**/*.yaml",
]

[tool.hatch.build.targets.wheel.shared-data]
"rules/eu_default_v1.yaml" = "share/sovereigngate/rules/eu_default_v1.yaml"

[tool.hatch.build.targets.sdist]
artifacts = [
    "src/sovereigngate/_version.py",
    "src/sovereigngate/**/*.json",
    "src/sovereigngate/**/*.yaml",
]

[tool.hatch.build.targets.sdist.force-include]
"rules/eu_default_v1.yaml" = "rules/eu_default_v1.yaml"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["sovereigngate"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["sovereigngate"]
plugins = ["pydantic.mypy"]
