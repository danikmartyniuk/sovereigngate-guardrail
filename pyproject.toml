[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereigngate-guardrail"
version = "0.1.0"
description = "Configurable data-minimization and technical safeguard controls (supporting GDPR Art. 5(1)(c) & Art. 32) for LiteLLM."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.50.0",
    "python-stdnum>=2.2,<3.0",
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "rich>=13.8.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
ner = [
    "numpy>=1.26.0",
    "onnxruntime>=1.19.0",
    "tokenizers>=0.20.0",
]
dev = [
    "mypy>=1.13.0",
    "onnx>=1.16.0",
    "pip-audit>=2.7.0",
    "presidio-analyzer==2.2.366",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
sovereigngate = "sovereigngate.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sovereigngate = ["py.typed"]

[tool.setuptools.data-files]
"share/sovereigngate/rules" = ["rules/eu_default_v1.yaml"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["sovereigngate"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["sovereigngate"]
plugins = ["pydantic.mypy"]
